# A transformer encoder block, after Vaswani et al. (2017).
#
# `flow: up` stacks the blocks upward and points every forward arrow the same
# way, so no layer says where it goes and no arrow says which faces to join.
# Each residual path leaves the trunk below a sublayer, passes it, and is added
# back in at the circle above it.
#
# Render with: synaplot render examples/transformer.yaml -o transformer.svg
name: transformer
flow: up
margin: 0.45
layers:
  - {kind: block, name: embed, text: Input Embedding, fill: "rgb:blue,5;red,2.5;white,5"}
  - {kind: block, name: pos, text: Positional Encoding, fill: "rgb:blue,5;red,2.5;white,5"}
  - {kind: block, name: attention, text: Multi-Head Attention}
  - {kind: operator, name: add1}
  - {kind: block, name: norm1, text: Layer Norm, fill: "rgb:red,1;black,0.3"}
  - {kind: block, name: feedforward, text: Feed Forward}
  - {kind: operator, name: add2}
  - {kind: block, name: norm2, text: Layer Norm, fill: "rgb:red,1;black,0.3"}
  - {kind: block, name: head, text: Linear + Softmax, fill: "rgb:magenta,5;black,7"}
connections:
  - {source: embed, target: pos}
  - {source: pos, target: attention}
  - {source: attention, target: add1}
  - {source: add1, target: norm1}
  - {source: norm1, target: feedforward}
  - {source: feedforward, target: add2}
  - {source: add2, target: norm2}
  - {source: norm2, target: head}
  - {source: pos, target: add1, style: bypass, clearance: 1}
  - {source: norm1, target: add2, style: bypass, clearance: 1}
