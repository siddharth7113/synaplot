# FCN-8s, after Long, Shelhamer and Darrell (2015).
# Predictions from three depths are summed, so a coarse deep prediction is
# refined by finer ones from earlier in the network.
# Render with: synaplot render examples/fcn8s.yaml -o fcn8s.svg
name: fcn8s
layers:
  - {kind: conv_relu, name: conv1, caption: conv1, filters: [64, 64], spatial: I,
     size: {width: [2, 2], height: 40, depth: 40}}
  - {kind: pool, name: pool1, size: {width: 1, height: 35, depth: 35}}
  - {kind: conv_relu, name: conv2, caption: conv2, filters: [128, 128], spatial: I/2,
     size: {width: [3, 3], height: 35, depth: 35}}
  - {kind: pool, name: pool2, size: {width: 1, height: 30, depth: 30}}
  - {kind: conv_relu, name: conv3, caption: conv3, filters: [256, 256, 256], spatial: I/4,
     size: {width: [4, 4, 4], height: 30, depth: 30}}
  - {kind: pool, name: pool3, size: {width: 1, height: 23, depth: 23}}
  - {kind: conv_relu, name: conv4, caption: conv4, filters: [512, 512, 512], spatial: I/8,
     size: {width: [6, 6, 6], height: 23, depth: 23}}
  - {kind: pool, name: pool4, size: {width: 1, height: 15, depth: 15}}
  - {kind: conv_relu, name: conv5, caption: conv5, filters: [512, 512, 512], spatial: I/16,
     size: {width: [6, 6, 6], height: 15, depth: 15}}
  - {kind: pool, name: pool5, size: {width: 1, height: 10, depth: 10}}
  - {kind: conv_relu, name: fc6, caption: fc6, filters: 4096, spatial: I/32,
     size: {width: 3, height: 10, depth: 10}}
  - {kind: conv, name: score, caption: score, filters: 21, spatial: I/32,
     size: {width: 1, height: 10, depth: 10}}

  # The 2x upsampled score is summed with the prediction from pool4.
  - {kind: unpool, name: up2, size: {width: 1, height: 15, depth: 15}}
  - {kind: sum, name: fuse4, caption: fuse pool4}
  - {kind: unpool, name: up4, size: {width: 1, height: 23, depth: 23}}
  - {kind: sum, name: fuse3, caption: fuse pool3}
  - {kind: unpool, name: up8, caption: 8x upsample, size: {width: 1, height: 40, depth: 40}}
  - {kind: softmax, name: out, caption: softmax, classes: 21,
     size: {width: 1, height: 40, depth: 40}}
connections:
  - {source: conv1, target: pool1}
  - {source: pool1, target: conv2}
  - {source: conv2, target: pool2}
  - {source: pool2, target: conv3}
  - {source: conv3, target: pool3}
  - {source: pool3, target: conv4}
  - {source: conv4, target: pool4}
  - {source: pool4, target: conv5}
  - {source: conv5, target: pool5}
  - {source: pool5, target: fc6}
  - {source: fc6, target: score}
  - {source: score, target: up2}
  - {source: up2, target: fuse4}
  - {source: fuse4, target: up4}
  - {source: up4, target: fuse3}
  - {source: fuse3, target: up8}
  - {source: up8, target: out}
  - {source: pool4, target: fuse4, style: skip}
  - {source: pool3, target: fuse3, style: skip, height: 1.5}
