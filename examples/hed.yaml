# HED, after Xie and Tu (2015).
# A VGG backbone with a side output taken from each stage. Every side output is
# upsampled to full resolution, and the five are fused into one edge map.
# Render with: synaplot render examples/hed.yaml -o hed.svg
name: hed
layers:
  - {kind: conv_relu, name: conv1, caption: conv1, filters: [64, 64], spatial: I,
     size: {width: [2, 2], height: 40, depth: 40}}
  - {kind: pool, name: pool1, size: {width: 1, height: 35, depth: 35}}
  - {kind: conv_relu, name: conv2, caption: conv2, filters: [128, 128], spatial: I/2,
     size: {width: [3, 3], height: 35, depth: 35}}
  - {kind: pool, name: pool2, size: {width: 1, height: 30, depth: 30}}
  - {kind: conv_relu, name: conv3, caption: conv3, filters: [256, 256, 256], spatial: I/4,
     size: {width: [4, 4, 4], height: 30, depth: 30}}
  - {kind: pool, name: pool3, size: {width: 1, height: 23, depth: 23}}
  - {kind: conv_relu, name: conv4, caption: conv4, filters: [512, 512, 512], spatial: I/8,
     size: {width: [5, 5, 5], height: 23, depth: 23}}
  - {kind: pool, name: pool4, size: {width: 1, height: 15, depth: 15}}
  - {kind: conv_relu, name: conv5, caption: conv5, filters: [512, 512, 512], spatial: I/16,
     size: {width: [5, 5, 5], height: 15, depth: 15}}

  # One side output per stage, drawn on a row below the backbone.
  - {kind: conv, name: side1, caption: side 1, filters: 1, spatial: I,
     size: {width: 1, height: 12, depth: 12},
     to: {layer: conv1, anchor: south, offset: {y: -8}}}
  - {kind: conv, name: side2, caption: side 2, filters: 1, spatial: I,
     size: {width: 1, height: 12, depth: 12},
     to: {layer: conv2, anchor: south, offset: {y: -9}}}
  - {kind: conv, name: side3, caption: side 3, filters: 1, spatial: I,
     size: {width: 1, height: 12, depth: 12},
     to: {layer: conv3, anchor: south, offset: {y: -10}}}
  - {kind: conv, name: side4, caption: side 4, filters: 1, spatial: I,
     size: {width: 1, height: 12, depth: 12},
     to: {layer: conv4, anchor: south, offset: {y: -12}}}
  - {kind: conv, name: side5, caption: side 5, filters: 1, spatial: I,
     size: {width: 1, height: 12, depth: 12},
     to: {layer: conv5, anchor: south, offset: {y: -14}}}

  - {kind: sum, name: fuse, caption: fuse, radius: 3,
     to: {layer: side5, anchor: east, offset: {x: 4}}}
  - {kind: softmax, name: out, caption: edge map, classes: 1,
     size: {width: 1, height: 40, depth: 40},
     to: {layer: fuse, anchor: east, offset: {x: 4}}}
connections:
  - {source: conv1, target: pool1}
  - {source: pool1, target: conv2}
  - {source: conv2, target: pool2}
  - {source: pool2, target: conv3}
  - {source: conv3, target: pool3}
  - {source: pool3, target: conv4}
  - {source: conv4, target: pool4}
  - {source: pool4, target: conv5}
  - {source: conv1, target: side1, source_anchor: south, target_anchor: north}
  - {source: conv2, target: side2, source_anchor: south, target_anchor: north}
  - {source: conv3, target: side3, source_anchor: south, target_anchor: north}
  - {source: conv4, target: side4, source_anchor: south, target_anchor: north}
  - {source: conv5, target: side5, source_anchor: south, target_anchor: north}
  - {source: side1, target: fuse, style: elbow, source_anchor: south, target_anchor: west}
  - {source: side2, target: fuse, style: elbow, source_anchor: south, target_anchor: west}
  - {source: side3, target: fuse, style: elbow, source_anchor: south, target_anchor: west}
  - {source: side4, target: fuse, style: elbow, source_anchor: south, target_anchor: west}
  - {source: side5, target: fuse, style: elbow, source_anchor: south, target_anchor: west}
  - {source: fuse, target: out}
