version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv sync --group docs
    build:
      html:
        - uv run sphinx-build -W --keep-going -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
