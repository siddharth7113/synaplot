name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  # Drawing a PyTorch model needs torch, which is too large for every cell of
  # the matrix, so it is tested once, from the CPU wheel index.
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev --extra torch
      - name: Run the tests, the torch ones included
        run: uv run pytest

  # Rendering needs a LaTeX toolchain, so it runs on one platform only. Tectonic
  # downloads the LaTeX packages it needs on first use, so its cache is worth
  # keeping between runs.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: ./.github/actions/latex-toolchain
      - run: uv sync --group dev
      - name: Run rendering tests
        env:
          SYNAPLOT_RENDER_TESTS: "1"
        run: uv run pytest -m render

  # Every diagram in the documentation is drawn while the page that shows it is
  # built, so this job needs the same toolchain as the rendering tests.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: ./.github/actions/latex-toolchain
      - run: uv sync --group docs
      - name: Build documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
